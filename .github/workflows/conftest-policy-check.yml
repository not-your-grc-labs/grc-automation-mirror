name: "Conftest policy check"

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - "policy/**"
  push:
    paths:
      - "terraform/**"
      - "policy/**"

permissions:
  id-token: write
  contents: read

jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3

      - name: "Install Conftest"
        run: |
          set -euo pipefail
          V=0.56.0
          curl -L -o conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${V}/conftest_${V}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: "Configure AWS credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::526053389648:role/github-terraform-ci-ops
          aws-region: eu-west-2

      - name: "Terraform init and plan to JSON"
        working-directory: terraform/lab
        env:
          TF_VAR_rds_password: ${{ secrets.TF_VAR_RDS_SECRET }}
          run: |
          terraform init -input=false
          terraform plan -input=false -out tfplan.bin
          terraform show -json tfplan.bin > tfplan.json

      - name: "Conftest test (namespace plan)"
        working-directory: terraform/lab
        run: |
          conftest test tfplan.json -p ../../policy --namespace plan
