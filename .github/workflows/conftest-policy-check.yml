name: "Conftest policy check"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - "policy/**"
  push:
    paths:
      - "terraform/**"
      - "policy/**"

permissions:
  id-token: write
  contents: read

jobs:
  conftest:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3

      - name: "Install Conftest"
        run: |
          set -euo pipefail
          V=0.66.0
          curl -L -o conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${V}/conftest_${V}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: "Configure AWS credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::526053389648:role/github-terraform-ci-ops
          aws-region: eu-west-2

      # Assumes new structure like:
      # terraform/noncompliant/...
      # terraform/compliant/...
      # policy/...
      # input/...
      #
      # If you're only running the noncompliant scenario for now, keep SCENARIO=noncompliant.
      # Later you can matrix this.
      - name: "Set scenario"
        run: echo "SCENARIO=noncompliant" >> $GITHUB_ENV
      
      - name: "Lab root"
        run: echo LAB_ROOT=${{ github.workspace }} >> $GITHUB_ENV

      - name: "Debug rds_password var presence"
        env:
          TF_VAR_rds_password: ${{ secrets.TF_VAR_RDS_SECRET }}
        run: |
          if [ -n "${TF_VAR_rds_password:-}" ]; then
            echo "TF_VAR_rds_password is set"
            echo "Length: ${#TF_VAR_rds_password}"
          else
            echo "TF_VAR_rds_password is NOT set"
          fi

      - name: "Terraform init and plan to JSON"
        env:
          TF_VAR_rds_password: ${{ secrets.TF_VAR_RDS_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p input
          terraform -chdir=terraform/scenarios/${SCENARIO} init -input=false
          terraform -chdir=terraform/scenarios/${SCENARIO} plan -input=false -out=$LAB_ROOT/input/tfplan.bin
          terraform -chdir=terraform/scenarios/${SCENARIO} show -json $LAB_ROOT/input/tfplan.bin > input/tfplan.json

      - name: "Conftest test (namespace plan)"
        run: |
          set -euo pipefail
          conftest test input/tfplan.json -p policy --namespace plan
